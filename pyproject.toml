[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-essay-scoring"
version = "0.1.0"
description = "Prompt-specific essay score regression on ASAP-AES"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.6,<2",
    "torch>=2.6,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
